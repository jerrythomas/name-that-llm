name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, self-test, notebook sync
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check src scripts

      - name: Format check
        run: uv run ruff format --check src scripts

      - name: Self-test
        run: uv run python scripts/selftest.py

      - name: Notebooks match their sources
        run: uv run python scripts/check_notebooks.py

      - name: Bundle builds
        run: uv run python scripts/build_bundle.py

  # There is deliberately no "rebuild and commit" job.  The check job above
  # already proves that the committed notebooks are exactly what
  # scripts/make_notebook.py and src/ntl produce, so a red build is the
  # signal to run `make notebook` locally.  Rebuilding here instead would
  # commit notebooks stripped of their stored outputs.
