name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, self-test, notebook sync
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check src scripts

      - name: Format check
        run: uv run ruff format --check src scripts

      - name: Self-test
        run: uv run python scripts/selftest.py

      - name: Notebooks match their sources
        run: uv run python scripts/check_notebooks.py

      - name: Bundle builds
        run: uv run python scripts/build_bundle.py

  rebuild-notebooks:
    name: rebuild notebooks
    runs-on: ubuntu-latest
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --locked --extra dev

      # The notebook builder is the source of truth for notebook 02 and
      # src/ntl is the source of truth for the inline package; this job keeps
      # the committed notebooks in step with both.
      - name: Regenerate notebook 02
        run: uv run python scripts/make_notebook.py

      - name: Inline the package into both notebooks
        run: |
          uv run python scripts/sync_notebook.py --notebook notebooks/02_style_and_structure.ipynb
          uv run python scripts/sync_notebook.py --notebook notebooks/01_eda.ipynb

      - name: Commit
        run: |
          if git diff --quiet -- notebooks; then
            echo "notebooks already up to date"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add notebooks
          git commit -m "chore: rebuild notebooks from make_notebook.py + src/ntl"
          git push
